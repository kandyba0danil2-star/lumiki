<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Лумики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pangolin&display=swap">
<style>
/* Layout: one phone-width column like a Telegram mini app — isometric room card on top, care actions, pet strip, 5-tab bottom bar */
:root{
  --bg:#F3E5D0; --surface:#FFF8EE; --sunk:#EAD7BC; --ink:#4A2F1D; --muted:#8A6A50; --line:#E2CBAA;
  --accent:#E5654F; --accent-ink:#FFFFFF; --spark:#E7A52B; --spark-ink:#4A2E00;
  --heart:#D9506E; --rare:#3F86B8; --epic:#8A5CC6; --ok:#5E9B4E; --stage:#F8EBD8; --veil:rgba(255,248,238,.25);
  --display:'Pangolin','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1612; --surface:#2A201A; --sunk:#16110D; --ink:#F4E4CF; --muted:#B39A82; --line:#433429;
    --accent:#F07C66; --accent-ink:#2A120B; --spark:#F2B640; --spark-ink:#2A1A00;
    --heart:#EE7590; --rare:#6CB0E0; --epic:#B08CEB; --ok:#86C273; --stage:#251C16; --veil:rgba(20,14,10,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1612; --surface:#2A201A; --sunk:#16110D; --ink:#F4E4CF; --muted:#B39A82; --line:#433429;
  --accent:#F07C66; --accent-ink:#2A120B; --spark:#F2B640; --spark-ink:#2A1A00;
  --heart:#EE7590; --rare:#6CB0E0; --epic:#B08CEB; --ok:#86C273; --stage:#251C16; --veil:rgba(20,14,10,.25); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--rare);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.brand{font-family:var(--display);font-size:26px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.coins{background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:900;font-variant-numeric:tabular-nums;font-size:16px;display:flex;gap:6px;align-items:center}
.coins i{color:var(--spark);font-style:normal}
.coins.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.12)}}

.sec{font-family:var(--display);font-size:19px;margin:22px 0 8px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 12px;max-width:60ch}

/* Room card */
.roomcard{position:relative;border-radius:24px;background:var(--stage);overflow:hidden;border:1.5px solid var(--line)}
.room-head{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:1;pointer-events:none}
.room-head>*{pointer-events:auto}
.rtitle{font-family:var(--display);font-size:20px;line-height:1.1;background:none;border:0;padding:0;text-align:left;cursor:text}
.rtitle small{display:block;font-family:var(--body);font-size:11.5px;font-weight:800;color:var(--muted)}
.pname-input{font-family:var(--display);font-size:19px;width:10ch;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:0}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface);border:1.5px solid currentColor;white-space:nowrap}
.chip.comfy{color:var(--accent);cursor:pointer;font-size:11px}
.r0{color:var(--muted)} .r1{color:var(--rare)} .r2{color:var(--epic)} .r3{color:var(--spark)}
svg.room{display:block;width:100%;height:auto}
.room .tap{cursor:pointer}
.status{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.status span{display:inline-block;background:var(--surface);color:var(--ink);font-weight:800;font-size:12.5px;padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
svg.pet{overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) scaleY(.985)}}
.halo{animation:halo 2.8s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
.wobble{animation:wob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}85%{transform:rotate(5deg)}}
.zz{fill:#FFF4DE;font-family:'Pangolin',sans-serif}
.heart{position:absolute;color:var(--heart);font-size:24px;pointer-events:none;animation:rise .9s ease-out forwards;z-index:3}
@keyframes rise{to{transform:translateY(-60px) scale(1.3);opacity:0}}
.lampglow{mix-blend-mode:screen;animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.85}}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.stat .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--muted);gap:8px}
.stat .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat.low .row span{color:var(--heart)}
.track{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:99px;transition:width .6s ease}
.f-h{background:var(--spark)} .f-j{background:var(--heart)} .f-e{background:var(--rare)} .f-x{background:var(--ok)}
.genes{grid-column:1/-1;font-size:12.5px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* Actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 4px 8px;font-weight:900;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;transition:transform .08s}
.act:active{transform:translateY(2px);border-bottom-width:2px}
.act small{font-weight:700;font-size:11.5px;color:var(--muted)}
.act.off{opacity:.45}
.act.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:14px}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 70%,#000)}
.act.primary small{color:var(--accent-ink);opacity:.8}
.act:disabled{cursor:not-allowed;opacity:.45}

/* Strip / cards */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.card{flex:none;width:88px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 6px 8px;cursor:pointer;text-align:center}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .nm{font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:11px;font-weight:800;color:var(--muted)}
.card svg{height:64px;width:100%}

/* Mini game */
.game{position:absolute;inset:0;background:var(--veil);z-index:2}
.game-bar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;background:var(--surface);border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.orb{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle,#FFFBE0 0 22%,#FFD84D 40%,rgba(255,200,40,.35) 58%,rgba(255,200,40,0) 70%);animation:orb 1.5s ease-in forwards}
.orb.pop{animation:pop .25s ease-out forwards}
@keyframes orb{0%{transform:scale(.3)}15%{transform:scale(1)}100%{transform:translateY(-26px) scale(.8);opacity:0}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}

/* Decor */
.comfort{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px}
.comfort b{font-family:var(--display);font-size:28px;color:var(--accent);line-height:1}
.comfort div{font-size:13px;font-weight:700;color:var(--muted)}
.comfort div strong{color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.item.on{border-color:var(--accent);border-width:2.5px}
.item .th{border-radius:12px;overflow:hidden;background:var(--stage);aspect-ratio:4/3}
.item .th svg{width:100%;height:100%;display:block}
.item .nm{font-weight:900;font-size:13.5px;line-height:1.2}
.item .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.item .price{color:var(--ink);background:var(--sunk);padding:2px 8px;border-radius:999px}
.item.on .price{background:var(--accent);color:var(--accent-ink)}

/* Breed */
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.slot{aspect-ratio:1;max-width:100%;border-radius:20px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:13px;text-align:center;padding:8px;background:var(--surface)}
.slot.full{border-style:solid;border-color:var(--accent)}
.slot svg{width:80%}
.plus{font-family:var(--display);font-size:28px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.picks .card{width:auto}
.picks .card:disabled{opacity:.45;cursor:not-allowed}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.box dt{color:var(--muted);font-weight:800}
.box dd{margin:0;font-weight:700}
.shop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shop p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;white-space:nowrap}
.btn.block{width:100%;margin-top:12px;padding:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Atlas */
.atlas{display:grid;grid-template-columns:64px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.atlas .h{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.atlas .rh{text-align:left}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.cell.unk{background:transparent;border:1.5px dashed var(--line);color:var(--line);font-family:var(--display);font-size:22px}
.cell svg{width:92%}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.legend b{font-variant-numeric:tabular-nums}

/* Economy */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.num b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.num span{font-size:12px;font-weight:800;color:var(--muted)}
.burn{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:12px}
.burn div{height:100%;background:var(--accent)}
.burnlbl{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:6px}
.flows{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.flows ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.flows h4{margin:0;font-size:13px;font-weight:900}
.log{display:flex;flex-direction:column}
.log div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log b{font-variant-numeric:tabular-nums;white-space:nowrap}
.plus-n{color:var(--ok)} .minus-n{color:var(--heart)}
.reset{background:none;border:0;color:var(--muted);font-weight:800;text-decoration:underline;cursor:pointer;padding:16px 0}
.reset.armed{color:var(--heart)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:8px 0 9px;font-size:11.5px;font-weight:900;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-1.5px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + 58px);z-index:9;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:16px;padding-right:16px}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin .25s ease-out}
.toast.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

@media (prefers-reduced-motion: reduce){
  .bob,.halo,.wobble,.orb,.heart,.coins.bump,.toast,.lampglow{animation:none!important}
  .orb{opacity:1}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Лумики<small id="sub">уютные питомцы</small></div>
    <div class="coins" id="coins" title="Искры — игровая валюта, будущий токен"><i>✦</i><span id="coinN">0</span></div>
  </header>

  <main>
    <section id="tab-home">
      <div class="roomcard" id="hab"></div>
      <div class="stats" id="stats"></div>
      <div class="actions" id="actions"></div>
      <h3 class="sec">Ваши лумики</h3>
      <div class="strip" id="strip"></div>
    </section>
    <section id="tab-decor" hidden></section>
    <section id="tab-breed" hidden></section>
    <section id="tab-atlas" hidden></section>
    <section id="tab-eco" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>Комната</button>
    <button data-tab="decor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h8l3 7H5z"/><path d="M12 10v8"/><path d="M8 21h8"/></svg>Декор</button>
    <button data-tab="breed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="13" rx="6.5" ry="8"/><path d="M8 12l2.5 2 2-3 2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Пары</button>
    <button data-tab="atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M13 4h5.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z"/></svg>Атлас</button>
    <button data-tab="eco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="currentColor" stroke="none"/></svg>Искры</button>
  </div>
</nav>
<div id="toasts" aria-live="polite"></div>

<script>
/* ---------- genetics ---------- */
const EL={fire:{n:'Огонь',hue:18,w:25,r:0},water:{n:'Вода',hue:205,w:25,r:0},leaf:{n:'Лес',hue:118,w:25,r:0},crystal:{n:'Кристалл',hue:182,w:15,r:2},shadow:{n:'Тень',hue:275,w:10,r:3}};
const PAT={none:{n:'Гладкий',w:35,r:0},spots:{n:'Пятна',w:25,r:1},stripes:{n:'Полосы',w:25,r:1},stars:{n:'Звёзды',w:15,r:3}};
const EARS={round:{n:'Круглые уши',w:30,r:0},pointy:{n:'Острые уши',w:30,r:0},horns:{n:'Рожки',w:25,r:1},antennae:{n:'Усики',w:15,r:2}};
const RAR=[{n:'Обычный',m:1},{n:'Редкий',m:1.3},{n:'Эпический',m:1.7},{n:'Легендарный',m:2.5}];
const STAGES=['малыш','подросток','взрослый'];
const COST={feed:3,breed:40,egg:60};
const MUT=0.1, KEY='lumiki-v1';

/* ---------- decor catalog ---------- */
const SLOTS={wall:'Обои',floor:'Пол',rug:'Ковёр',bed:'Лежанка',corner:'Угол',big:'Мебель',pic:'Картина',shelf:'Полка',toy:'Игрушка'};
const ITEMS={
  w_cream:{slot:'wall',n:'Сливочные обои',price:0,c:0},
  w_mint:{slot:'wall',n:'Мятная полоска',price:25,c:2},
  w_berry:{slot:'wall',n:'Клубничный горошек',price:30,c:2},
  w_wood:{slot:'wall',n:'Деревянные панели',price:35,c:3},
  w_star:{slot:'wall',n:'Звёздная ночь',price:45,c:4},
  f_planks:{slot:'floor',n:'Дощатый пол',price:0,c:0},
  f_carpet:{slot:'floor',n:'Мягкий ковролин',price:25,c:2},
  f_check:{slot:'floor',n:'Шахматная плитка',price:30,c:2},
  rug_round:{slot:'rug',n:'Круглый коврик',price:15,c:2},
  rug_stripe:{slot:'rug',n:'Полосатый половик',price:20,c:2},
  rug_cloud:{slot:'rug',n:'Ковёр-облако',price:35,c:4},
  bed_pillow:{slot:'bed',n:'Подушка',price:20,c:3},
  bed_basket:{slot:'bed',n:'Корзинка-лежанка',price:45,c:6},
  c_cactus:{slot:'corner',n:'Кактус',price:12,c:1},
  c_ficus:{slot:'corner',n:'Фикус',price:22,c:3},
  c_lamp:{slot:'corner',n:'Торшер',price:30,c:4,note:'светит ночью'},
  big_books:{slot:'big',n:'Книжный шкаф',price:50,c:6},
  big_aqua:{slot:'big',n:'Аквариум',price:70,c:8},
  pic_poster:{slot:'pic',n:'Постер с лумиком',price:15,c:2},
  pic_mount:{slot:'pic',n:'Картина «Горы»',price:22,c:2},
  shelf_books:{slot:'shelf',n:'Полка с книгами',price:20,c:2},

/* r: room object; o.subject: html of pet/egg at its place; o.crop; o.dim */

  if(p.awayUntil){const [x,y]=fp(88,78);return `<g><rect x="${x-34}" y="${y-40}" width="68" height="30" rx="6" fill="#FFF8EE" stroke="#C99A6B" stroke-width="2" transform="rotate(-4 ${x} ${y-25})"/><text x="${x}" y="${y-21}" text-anchor="middle" font-family="Pangolin,sans-serif" font-size="13" fill="#4A2F1D" transform="rotate(-4 ${x} ${y-25})">Ушёл в поход</text></g>`}

/* ---------- loop ---------- */
function tick(){
  const now=Date.now();let dt=(now-S.lastTick)/1000;S.lastTick=now;dt=Math.min(Math.max(dt,0),7200);
  let changed=false;
  for(const p of S.pets){
    if(p.egg){if(!p.ready&&now>=p.hatchAt){p.ready=true;changed=true;toast('Яйцо треснуло — можно вылуплять!')}continue}
    if(p.restUntil&&now>=p.restUntil){p.restUntil=0;changed=true}
    if(p.awayUntil){if(now>=p.awayUntil){finishTrip(p);changed=true}continue}
    const m0=mood(p);
    p.hunger=clamp(p.hunger-0.11*dt);
    p.joy=clamp(p.joy-(p.hunger<20?0.2:0.07)*(1-cozy(p))*dt);
    if(p.sleeping){p.energy=clamp(p.energy+0.8*dt);if(p.energy>=100){p.sleeping=false;changed=true;toast(`${p.name} выспался`)}}
    else p.energy=clamp(p.energy-0.04*dt);
    if(mood(p)!==m0)changed=true;
  }
  const per=period();if(per!==S._per){S._per=per;changed=true}
  if(changed){save();renderAll()}else renderLive();
}
const mood=p=>p.sleeping?'z':(p.joy<30||p.hunger<20)?'sad':'ok';
setInterval(()=>S&&save(),5000);

/* ---------- actions ---------- */
function act(kind){
  const p=sel();if(!p||game)return;
  if(kind==='hatch'){if(!p.ready)return;p.egg=false;p.ready=false;p.name=randName();p.xp=0;p.hunger=70;p.joy=85;p.energy=90;p.room=defRoom();p.inv=Object.values(p.room);
    const isNew=discover(p);haptic('n','success');toast(`Вылупился ${p.name}! ${RAR[rarity(p.genes)].n}${isNew?' · новая запись в атласе':''}`);return done()}
  if(p.awayUntil)return toast(`${p.name} ещё в походе`);
  if(kind==='feed'){if(p.hunger>=95)return toast(`${p.name} не голоден`);if(p.sleeping)return toast('Сначала разбудите');
    if(!spend(COST.feed,`Корм для ${p.name}`))return;p.hunger=clamp(p.hunger+28);p.joy=clamp(p.joy+4);addXp(p,4);haptic('i','light');return done()}
  if(kind==='sleep'){p.sleeping=!p.sleeping;toast(p.sleeping?`${p.name} уснул${p.room.bed?' на лежанке':''}`:`${p.name} проснулся`);return done()}
  if(kind==='play'){if(p.sleeping)return toast('Тсс, он спит');if(p.energy<20)return toast(`${p.name} устал — уложите спать`);return startGame(p)}
  if(kind==='trip'){
    if(stage(p)<2)return toast('В поход ходят только взрослые');
    if(p.sleeping)return toast('Сначала разбудите');
    if(p.energy<30)return toast('Нужно хотя бы 30 энергии');
    if(p.hunger<20)return toast('Покормите перед дорогой');
    p.energy=clamp(p.energy-30);p.hunger=clamp(p.hunger-20);p.awayUntil=Date.now()+45000;toast(`${p.name} ушёл в поход на 45 секунд`);return done()}
}
function done(){save();renderAll()}
function finishTrip(p){
  p.awayUntil=0;const n=Math.round(rand(12,24)*RAR[rarity(p.genes)].m*(1+cozy(p)));earn(n,`Поход: ${p.name}`);addXp(p,10);
  let msg=`${p.name} вернулся: +${n} ✦`;
  if(Math.random()<0.2){addEgg(randomGenes(p.genes.el),30,'найдено в походе');msg+=' и нашёл яйцо!'}
  toast(msg);
}
function randomGenes(el){el=el||pickW(EL);return{el,hue:Math.round((EL[el].hue+rand(-30,30)+360)%360),pat:pickW(PAT),ears:pickW(EARS),glow:Math.random()<0.03}}
function mixGenes(a,b){
  const m=()=>Math.random()<MUT,pk=(x,y)=>Math.random()<.5?x:y,d=((b.hue-a.hue+540)%360)-180;
  return{el:m()?pickW(EL):pk(a.el,b.el),pat:m()?pickW(PAT):pk(a.pat,b.pat),ears:m()?pickW(EARS):pk(a.ears,b.ears),
    hue:Math.round((a.hue+d/2+rand(-25,25)+360)%360),glow:(a.glow||b.glow)?Math.random()<.35:Math.random()<.05};
}
function addEgg(genes,secs,from){const e={id:S.nextId++,egg:true,genes,hatchAt:Date.now()+secs*1000,from};S.pets.push(e);return e}

function tapPet(e){
  const p=sel();if(!p||p.egg||game||p.awayUntil)return;
  if(p.sleeping)return toast('Тсс, он спит');
  const now=Date.now();if(now-lastPet<350)return;lastPet=now;
  p.joy=clamp(p.joy+2);haptic('i','soft');
  const hab=$('#hab'),r=hab.getBoundingClientRect(),h=document.createElement('span');
  h.className='heart';h.textContent='♥';h.style.left=(e.clientX-r.left-8)+'px';h.style.top=(e.clientY-r.top-24)+'px';
  hab.appendChild(h);setTimeout(()=>h.remove(),900);renderLive();
}

/* ---------- mini game ---------- */
function startGame(p){
  p.energy=clamp(p.energy-20);p.hunger=clamp(p.hunger-5);
  const ov=document.createElement('div');ov.className='game';
  ov.innerHTML=`<div class="game-bar"><span>Лови светлячков!</span><span><b id="gT">10</b> с · поймано <b id="gC">0</b></span></div>`;
  $('#hab').appendChild(ov);
  game={p,caught:0,end:Date.now()+10000,ov};
  game.spawn=setInterval(spawnOrb,480);spawnOrb();
  game.timer=setInterval(()=>{const l=Math.ceil((game.end-Date.now())/1000);$('#gT').textContent=Math.max(0,l);if(l<=0)endGame()},150);
  renderActions();
}
function spawnOrb(){
  if(!game)return;const b=document.createElement('button');b.className='orb';b.setAttribute('aria-label','Светлячок');
  b.style.left=rand(12,88)+'%';b.style.top=rand(26,86)+'%';
  b.addEventListener('click',()=>{if(!game||b.disabled)return;b.disabled=true;game.caught++;haptic('i','light');$('#gC').textContent=game.caught;b.classList.add('pop');setTimeout(()=>b.remove(),250)});
  game.ov.appendChild(b);setTimeout(()=>b.isConnected&&!b.disabled&&b.remove(),1500);
}
function endGame(){
  clearInterval(game.spawn);clearInterval(game.timer);
  const {p,caught,ov}=game;game=null;ov.remove();
  const n=Math.round(caught*RAR[rarity(p.genes)].m*(1+cozy(p))*(p.hunger<20?.5:1));
  p.joy=clamp(p.joy+20);addXp(p,6);earn(n,`Игра: ${p.name}`);
  toast(`Поймано ${caught} — +${n} ✦${p.hunger<20?' (голодный — половина)':''}`);done();
}

/* ---------- decor ---------- */
function useItem(id){
  const p=sel(),it=ITEMS[id];if(!p||p.egg)return;
  if(p.room[it.slot]===id){if(it.slot==='wall'||it.slot==='floor')return;delete p.room[it.slot];toast(`${it.n}: убрано`);return done()}
  if(!p.inv.includes(id)){if(!spend(it.price,`${it.n} для ${p.name}`))return;p.inv.push(id);haptic('n','success')}
  const before=comfort(p);p.room[it.slot]=id;const d=comfort(p)-before;
  toast(`${it.n} — в комнате${d>0?` · уют +${d}`:''}`);done();
}

/* ---------- breed / shop ---------- */
function canBreed(p){if(p.egg)return'яйцо';if(stage(p)<2)return'ещё '+STAGES[stage(p)];if(p.awayUntil)return'в походе';if(p.restUntil>Date.now())return'отдыхает';return''}
function toggleBreed(id){const i=breedSel.indexOf(id);if(i>=0)breedSel.splice(i,1);else{if(breedSel.length>=2)breedSel.shift();breedSel.push(id)}renderBreed()}
function breed(){
  const [a,b]=breedSel.map(pet);if(!a||!b||canBreed(a)||canBreed(b))return;
  if(!spend(COST.breed,`Пара ${a.name} + ${b.name}`))return;
  const e=addEgg(mixGenes(a.genes,b.genes),30,`${a.name} + ${b.name}`);
  a.restUntil=b.restUntil=Date.now()+60000;breedSel=[];S.selected=e.id;
  haptic('n','success');toast('Появилось яйцо! Вылупится через 30 секунд');setTab('home');done();
}
function buyEgg(){if(!spend(COST.egg,'Яйцо из лавки'))return;const e=addEgg(randomGenes(),20,'лавка');S.selected=e.id;toast('Яйцо куплено');setTab('home');done()}

     <div class="genes"><span>${EL[g.el].n} · ${PAT[g.pat].n} · ${EARS[g.ears].n}${g.glow?' · Свечение':''}</span><span>×${RAR[rarity(g)].m}${bonus?` · уют +${bonus}%`:''}</span></div>`;

  else{
    const away=!!p.awayUntil,adult=stage(p)===2;

      B('play','Играть','−20 энергии',away||p.sleeping||p.energy<20)+
      B('sleep',p.sleeping?'Разбудить':'Спать',p.sleeping?'включить свет':'выключить свет',away)+
      B('trip','Поход',adult?'45 сек':'со взрослым',away||!adult||p.sleeping||p.energy<30||p.hunger<20);
  }
  el.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));
}
function stripStatus(p){if(p.egg)return p.ready?'готово!':'яйцо';if(p.awayUntil)return'в походе';if(p.sleeping)return'спит';if(p.hunger<20)return'голоден';if(p.joy<30)return'скучает';return STAGES[stage(p)]}
function renderStrip(){
  const el=$('#strip');
  el.innerHTML=S.pets.map(p=>`<button class="card" aria-pressed="${p.id===S.selected}" data-id="${p.id}">${drawAny(p,{})}<div class="nm">${p.egg?'Яйцо':esc(p.name)}</div><div class="st">${stripStatus(p)}</div></button>`).join('');
  el.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{if(game)return;S.selected=+b.dataset.id;done()}));
}
function renderDecor(){
  const el=$('#tab-decor'),p=sel();
  if(!p||p.egg){el.innerHTML=`<h3 class="sec">Декор</h3><p class="lead">Сначала выберите лумика — у яйца пока нет своей комнаты.</p><div class="strip" id="dstrip"></div>`;
    const ds=$('#dstrip');ds.innerHTML=S.pets.filter(x=>!x.egg).map(x=>`<button class="card" data-id="${x.id}">${petSVG(x,{})}<div class="nm">${esc(x.name)}</div></button>`).join('');
    ds.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{S.selected=+b.dataset.id;done()}));return}
  const c=comfort(p),bonus=Math.round(cozy(p)*100);
  const list=Object.entries(ITEMS).filter(([,it])=>it.slot===decorCat);
  el.innerHTML=`<h3 class="sec">Комнатка ${esc(p.name)}</h3>
    <div class="roomcard">${roomSVG(p.room,{subject:subjectFor(p,{}),dim:p.sleeping})}</div>
    <div class="comfort"><b>${c}</b><div><strong>Уют</strong> — +${bonus}% Искр с игр и походов, радость падает на ${bonus}% медленнее. Максимум +60%.</div></div>
    <div class="cats">${Object.entries(SLOTS).map(([k,n])=>`<button class="cat" data-c="${k}" aria-pressed="${k===decorCat}">${n}</button>`).join('')}</div>
    <div class="items">${list.map(([id,it])=>{const on=p.room[it.slot]===id,own=p.inv.includes(id);
      const r2={...defRoom(),...(it.slot==='wall'||it.slot==='floor'?p.room:{wall:p.room.wall,floor:p.room.floor}),[it.slot]:id};
      return `<button class="item${on?' on':''}" data-i="${id}"><div class="th">${roomSVG(r2,{crop:CROP[it.slot]})}</div><div class="nm">${it.n}</div>
        <div class="meta"><span>уют +${it.c}${it.note?' · '+it.note:''}</span><span class="price">${on?(it.slot==='wall'||it.slot==='floor'?'стоит':'убрать'):own?'поставить':it.price?it.price+' ✦':'даром'}</span></div></button>`}).join('')}</div>`;
  el.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{decorCat=b.dataset.c;renderDecor()}));
  el.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>useItem(b.dataset.i)));
}
function renderBreed(){
  const el=$('#tab-breed'),[a,b]=breedSel.map(pet);
  const slot=p=>p?`<div class="slot full">${petSVG(p,{})}</div>`:`<div class="slot">Выберите взрослого</div>`;
  const cand=S.pets.filter(p=>!p.egg);
  let fc='';
  if(a&&b){const ga=a.genes,gb=b.genes,u=(x,y,T)=>[...new Set([T[x].n,T[y].n])].join(' или ');
    fc=`<div class="box"><dl><dt>Стихия</dt><dd>${u(ga.el,gb.el,EL)}</dd><dt>Узор</dt><dd>${u(ga.pat,gb.pat,PAT)}</dd><dt>Уши</dt><dd>${u(ga.ears,gb.ears,EARS)}</dd>
      <dt>Мутация</dt><dd>${MUT*100}% на каждый признак — так появляются Кристалл, Тень, Звёзды</dd><dt>Свечение</dt><dd>${ga.glow||gb.glow?'35%':'5%'}</dd></dl></div>`}
  const ok=a&&b&&!canBreed(a)&&!canBreed(b);
  el.innerHTML=`<h3 class="sec">Пары</h3><p class="lead">Два взрослых лумика дают яйцо. Признаки берутся от родителей, но иногда случается мутация — так рождаются редкие и легендарные лумики.</p>
    <div class="pair">${slot(a)}<span class="plus">+</span>${slot(b)}</div>${fc}
    <button class="btn block" id="doBreed" ${ok?'':'disabled'}>Свести пару · ${COST.breed} ✦</button>
    <h3 class="sec">Кого выбрать</h3>
    <div class="picks">${cand.map(p=>{const why=canBreed(p);return`<button class="card" data-id="${p.id}" aria-pressed="${breedSel.includes(p.id)}" ${why?'disabled':''}>${petSVG(p,{})}<div class="nm">${esc(p.name)}</div><div class="st">${why==='отдыхает'?`отдых <span data-until="${p.restUntil}">${fmt(p.restUntil-Date.now())}</span>`:why||RAR[rarity(p.genes)].n}</div></button>`}).join('')}</div>
    <h3 class="sec">Лавка</h3>
    <div class="box shop"><div><b>Случайное яйцо</b><p>Обычно обычный лумик, но может повезти. Вылупится через 20 секунд.</p></div><button class="btn" id="buyEgg">${COST.egg} ✦</button></div>`;
  el.querySelectorAll('.picks .card').forEach(c=>c.addEventListener('click',()=>toggleBreed(+c.dataset.id)));
  $('#doBreed').addEventListener('click',breed);$('#buyEgg').addEventListener('click',buyEgg);
}
function renderAtlas(){
  const el=$('#tab-atlas'),found=Object.keys(S.atlas).length,tot=Object.keys(EL).length*Object.keys(PAT).length;
  let g=`<div></div>`+Object.values(PAT).map(p=>`<div class="h">${p.n}</div>`).join('');
  for(const e in EL){g+=`<div class="h rh">${EL[e].n}</div>`;for(const pt in PAT){const a=S.atlas[e+'-'+pt];
    g+=a?`<div class="cell" title="${EL[e].n}, ${PAT[pt].n}">${petSVG({genes:a,xp:100,joy:80,hunger:80},{})}</div>`:`<div class="cell unk" aria-label="Не открыт">?</div>`}}
  el.innerHTML=`<h3 class="sec">Атлас · ${found} из ${tot}</h3><p class="lead">Каждая пара «стихия + узор» — отдельная запись. Нижние строки и колонка «Звёзды» встречаются реже всего.</p>
    <div class="atlas">${g}</div>
    <h3 class="sec">Редкость и множитель добычи</h3>
    <div class="legend">${RAR.map((r,i)=>`<div class="r${i}">${r.n}<b>×${r.m}</b></div>`).join('')}</div>`;
}
function renderEco(){
  const el=$('#tab-eco'),pct=S.earned?Math.round(S.spent/S.earned*100):0;
  el.innerHTML=`<h3 class="sec">Экономика Искр</h3>
    <div class="nums"><div class="num"><b>${S.earned}</b><span>добыто</span></div><div class="num"><b>${S.spent}</b><span>сожжено</span></div><div class="num"><b>${S.coins}</b><span>на руках</span></div></div>
    <div class="burn"><div style="width:${Math.min(100,pct)}%"></div></div><div class="burnlbl">Сожжено ${pct}% от всего добытого</div>
    <h3 class="sec">Как это станет монетой</h3>
    <p class="lead">Сейчас Искры — обычные игровые очки. Когда у игры будут постоянные игроки, их можно перевести в токен на TON. Всё, что игроки тратят, сгорает: чем больше трат внутри игры, тем меньше монет продают и тем стабильнее цена.</p>
    <div class="flows"><div class="box" style="margin:0"><h4 class="plus-n">Откуда приходят</h4><ul><li>Мини-игра со светлячками</li><li>Походы взрослых</li><li>Редкость и уют умножают добычу</li></ul></div>
    <div class="box" style="margin:0"><h4 class="minus-n">Куда сгорают</h4><ul><li>Мебель и декор — 10–70 ✦</li><li>Корм — ${COST.feed} ✦</li><li>Пары — ${COST.breed} ✦</li><li>Яйца в лавке — ${COST.egg} ✦</li></ul></div></div>
    <h3 class="sec">Последние операции</h3>
    <div class="log">${S.log.slice(0,10).map(l=>`<div><span>${esc(l.why)}</span><b class="${l.n>0?'plus-n':'minus-n'}">${l.n>0?'+':''}${l.n} ✦</b></div>`).join('')}</div>
    <button class="reset" id="reset">Начать заново</button>`;
  const r=$('#reset');r.addEventListener('click',()=>{if(r.classList.contains('armed')){try{localStorage.removeItem(KEY)}catch(e){}S=initial();migrate();S.pets.forEach(p=>{if(!p.egg)discover(p)});breedSel=[];toast('Новая игра');setTab('home');done();return}
    r.classList.add('armed');r.textContent='Весь прогресс пропадёт. Нажмите ещё раз';setTimeout(()=>{if(r.isConnected){r.classList.remove('armed');r.textContent='Начать заново'}},4000)});
}
function rename(){
  const p=sel(),b=$('#pname'),i=document.createElement('input');i.className='pname-input';i.id='pname-input';i.value=p.name;i.maxLength=14;
  b.replaceWith(i);i.focus();i.select();
  const fin=()=>{const v=i.value.trim();if(v)p.name=v;done()};
  i.addEventListener('blur',fin);i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur()});
}
function setTab(t){tab=t;['home','decor','breed','atlas','eco'].forEach(k=>$('#tab-'+k).hidden=k!==t);
  document.querySelectorAll('.nav button').forEach(b=>b.dataset.tab===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  renderAll();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{haptic('s');setTab(b.dataset.tab)}));

/* ---------- Telegram ---------- */
const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
function haptic(k,v){try{if(!TG)return;if(k==='n')TG.HapticFeedback.notificationOccurred(v);else if(k==='s')TG.HapticFeedback.selectionChanged();else TG.HapticFeedback.impactOccurred(v)}catch(e){}}
function tgInit(){
  if(!TG)return;
  try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}
  const apply=()=>{document.documentElement.setAttribute('data-theme',TG.colorScheme==='dark'?'dark':'light');
    const bg=getComputedStyle(document.body).backgroundColor;try{TG.setHeaderColor(bg);TG.setBackgroundColor(bg);TG.setBottomBarColor&&TG.setBottomBarColor(bg)}catch(e){}};
  apply();TG.onEvent('themeChanged',apply);
  const u=TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u&&u.first_name)$('#sub').textContent='дом · '+u.first_name;
}
function start(data){
  tgInit();
  S=(data&&data.S)||load()||initial();
  migrate();S.pets.forEach(p=>{if(!p.egg)discover(p)});
  if(!S.lastTick)S.lastTick=Date.now();
  tick();setTab('home');setInterval(tick,1000);
  window.claude?.hot?.snapshot?.(()=>({S}));
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
