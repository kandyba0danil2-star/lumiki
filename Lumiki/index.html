<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Lumiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Pangolin&display=swap">
<style>
/* Layout: one phone-width column like a Telegram mini app — room switcher, isometric room card, care actions with inline panels, pet strip, 6-tab bottom bar */
:root{
  --bg:#F3E5D0; --surface:#FFF8EE; --sunk:#EAD7BC; --ink:#4A2F1D; --muted:#8A6A50; --line:#E2CBAA;
  --accent:#E5654F; --accent-ink:#FFFFFF; --spark:#E7A52B; --dust:#7E6BD6; --spark-ink:#4A2E00;
  --heart:#D9506E; --rare:#3F86B8; --epic:#8A5CC6; --ok:#5E9B4E; --stage:#F8EBD8; --veil:rgba(255,248,238,.3);
  --display:'Pangolin','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1612; --surface:#2A201A; --sunk:#16110D; --ink:#F4E4CF; --muted:#B39A82; --line:#433429;
    --accent:#F07C66; --accent-ink:#2A120B; --spark:#F2B640; --dust:#A898F0; --spark-ink:#2A1A00;
    --heart:#EE7590; --rare:#6CB0E0; --epic:#B08CEB; --ok:#86C273; --stage:#251C16; --veil:rgba(20,14,10,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1612; --surface:#2A201A; --sunk:#16110D; --ink:#F4E4CF; --muted:#B39A82; --line:#433429;
  --accent:#F07C66; --accent-ink:#2A120B; --spark:#F2B640; --dust:#A898F0; --spark-ink:#2A1A00;
  --heart:#EE7590; --rare:#6CB0E0; --epic:#B08CEB; --ok:#86C273; --stage:#251C16; --veil:rgba(20,14,10,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--rare);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.brand{font-family:var(--display);font-size:26px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.wallet{display:flex;gap:6px;align-items:center}
.coins{background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;display:flex;gap:5px;align-items:center}
.coins i{color:var(--spark);font-style:normal}
.coins.dust i{color:var(--dust)}
.coins.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.12)}}
.speed{font-size:10.5px;font-weight:900;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:1px 6px}

.sec{font-family:var(--display);font-size:19px;margin:22px 0 8px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 12px;max-width:60ch}
.muted{color:var(--muted)}

/* Rooms switcher */
.rooms{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.rchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.rchip small{color:var(--muted);font-weight:800}
.rchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rchip[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.rchip.locked{border-style:dashed;color:var(--muted);cursor:default}

/* Room card */
.roomcard{position:relative;border-radius:24px;background:var(--stage);overflow:hidden;border:1.5px solid var(--line)}
.room-head{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:1;pointer-events:none}
.room-head>*{pointer-events:auto}
.rtitle{font-family:var(--display);font-size:20px;line-height:1.1;background:none;border:0;padding:0;text-align:left;cursor:text}
.rtitle small{display:block;font-family:var(--body);font-size:11.5px;font-weight:800;color:var(--muted)}
.pname-input{font-family:var(--display);font-size:19px;width:10ch;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:0}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface);border:1.5px solid currentColor;white-space:nowrap}
.chip.comfy{color:var(--accent);cursor:pointer;font-size:11px}
.chip.gold{color:var(--spark)}
.r0{color:var(--muted)} .r1{color:var(--rare)} .r2{color:var(--epic)} .r3{color:var(--spark)}
svg.room{display:block;width:100%;height:auto}
.room .tap{cursor:pointer}
.status{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.status span{display:inline-block;background:var(--surface);color:var(--ink);font-weight:800;font-size:12.5px;padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
svg.pet{overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) scaleY(.985)}}
.halo{animation:halo 2.8s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
.wobble{animation:wob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}85%{transform:rotate(5deg)}}
.zz{fill:#FFF4DE;font-family:'Pangolin',sans-serif}
.marker{animation:mk 1.4s ease-in-out infinite}
@keyframes mk{50%{transform:translateY(-3px)}}
.heart{position:absolute;color:var(--heart);font-size:24px;pointer-events:none;animation:rise .9s ease-out forwards;z-index:3}
@keyframes rise{to{transform:translateY(-60px) scale(1.3);opacity:0}}
.lampglow{mix-blend-mode:screen;animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.85}}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.stat .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--muted);gap:8px}
.stat .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat.low .row span{color:var(--heart)}
.track{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.track.thin{height:6px}
.fill{height:100%;border-radius:99px;transition:width .6s ease}
.f-h{background:var(--spark)} .f-j{background:var(--heart)} .f-e{background:var(--rare)} .f-x{background:var(--ok)} .f-a{background:var(--accent)}
.skills{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skills .row{font-size:11.5px}

/* Actions + panels */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 4px 8px;font-weight:900;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;transition:transform .08s}
.act:active{transform:translateY(2px);border-bottom-width:2px}
.act small{font-weight:700;font-size:11.5px;color:var(--muted)}
.act.off{opacity:.45}
.act.open{border-color:var(--accent)}
.act.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:14px}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 70%,#000)}
.act.primary small{color:var(--accent-ink);opacity:.8}
.act:disabled{cursor:not-allowed;opacity:.45}
.panel{margin-top:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:6px}
.panel h4{margin:6px 10px 4px;font-family:var(--display);font-weight:400;font-size:17px}
.opt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.opt:hover{background:var(--stage)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:14px}
.opt .t span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.opt .go{font-weight:900;font-size:12.5px;background:var(--sunk);padding:4px 10px;border-radius:999px;white-space:nowrap}
.opt.off{opacity:.5;cursor:not-allowed}
.opt.off .go{background:transparent;border:1px dashed var(--line)}
.ico{width:34px;height:34px;flex:none;border-radius:10px;background:var(--stage);display:grid;place-items:center}
.ico svg{width:24px;height:24px}

/* Info */
.info{margin-top:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;display:grid;gap:6px;font-size:13px;font-weight:700}
.info .ln{display:flex;justify-content:space-between;gap:10px;align-items:center}
.info .ln span:first-child{color:var(--muted)}
.info .ln span:last-child{text-align:right}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:900;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Strip / cards */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.card{flex:none;width:88px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 6px 8px;cursor:pointer;text-align:center}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .nm{font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:11px;font-weight:800;color:var(--muted)}
.card svg{height:64px;width:100%}

/* Mini games */
.game{position:absolute;inset:0;background:var(--veil);z-index:2;touch-action:manipulation}
.game-bar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;background:var(--surface);border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);z-index:2}
.orb{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle,#FFFBE0 0 22%,#FFD84D 40%,rgba(255,200,40,.35) 58%,rgba(255,200,40,0) 70%);animation:orb 1.5s ease-in forwards}
.orb.pop{animation:pop .25s ease-out forwards}
@keyframes orb{0%{transform:scale(.3)}15%{transform:scale(1)}100%{transform:translateY(-26px) scale(.8);opacity:0}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}
.mem{position:absolute;left:12px;right:12px;top:52px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.mc{border:0;border-radius:12px;background:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.mc svg{width:60%;height:60%;opacity:0;transition:opacity .15s}
.mc{position:relative}.mc::after{content:'✦';position:absolute;color:var(--accent);font-size:22px;font-weight:900}.mc.up::after,.mc.ok::after{content:none}
.mc.up{background:var(--surface);border:2px solid var(--line)}
.mc.up svg,.mc.ok svg{opacity:1}
.mc.ok{background:var(--surface);border:2px solid var(--ok);opacity:.7}
.run{position:absolute;inset:0;overflow:hidden;cursor:pointer}
.run .gnd{position:absolute;left:0;right:0;bottom:0;height:22%;background:#8DBF6A;border-top:4px solid #6FA14F}
.run .rp{position:absolute;bottom:22%;width:64px;height:64px;left:14%}
.run .rp svg{width:100%;height:100%;display:block}
.run{background:linear-gradient(#BFE6F5 0%,#E3F3F8 60%,#E3F3F8 100%)}
.run .cl{position:absolute;height:14px;border-radius:99px;background:#fff;opacity:.9}
.run .pd{position:absolute;bottom:calc(22% - 6px);height:14px;border-radius:50%;background:#5DA9D6;border:2px solid #3F86B8}
.run .hint{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:900;color:#4A2F1D;font-size:14px}
.mess{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;cursor:pointer;padding:0}
.mess svg{width:100%;height:100%}
.mess.gone{animation:pop .25s ease-out forwards}

/* Tasks */
.streak{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.streak .big{display:flex;align-items:baseline;gap:8px}
.streak .big b{font-family:var(--display);font-size:42px;line-height:1;color:var(--accent)}
.streak .big span{font-weight:800;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.day{border-radius:12px;background:var(--stage);border:1.5px solid var(--line);padding:6px 2px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.2;min-width:0}
.day b{display:block;font-size:12px;color:var(--ink)}
.day.done{background:var(--ok);border-color:var(--ok);color:#fff}
.day.done b{color:#fff}
.day.now{border-color:var(--accent);border-width:2.5px}
.quest{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px}
.quest .t{flex:1;min-width:0}
.quest .t b{font-size:14px}
.quest .t span{font-size:12px;font-weight:800;color:var(--muted)}
.quest.claimed{opacity:.55}
.chest{display:flex;gap:12px;align-items:center;background:var(--stage);border:2px dashed var(--line);border-radius:18px;padding:12px;margin-top:10px}
.chest.ready{border-style:solid;border-color:var(--accent);background:var(--surface)}
.chest svg{width:48px;height:48px;flex:none}

/* Decor */
.house{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.house .hd{display:flex;justify-content:space-between;align-items:baseline}
.house .hd b{font-family:var(--display);font-size:22px;font-weight:400}
.unl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.unl span{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.unl span.on{background:var(--ok);border-color:var(--ok);color:#fff}
.comfort{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px}
.comfort b{font-family:var(--display);font-size:28px;color:var(--accent);line-height:1}
.comfort div{font-size:13px;font-weight:700;color:var(--muted)}
.comfort div strong{color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.item.on{border-color:var(--accent);border-width:2.5px}
.item .th{border-radius:12px;overflow:hidden;background:var(--stage);aspect-ratio:4/3}
.item .th svg{width:100%;height:100%;display:block}
.item .nm{font-weight:900;font-size:13.5px;line-height:1.2}
.item .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);flex-wrap:wrap}
.item .price{color:var(--ink);background:var(--sunk);padding:2px 8px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.item.on .price{background:var(--accent);color:var(--accent-ink)}
.mi{display:inline-block;width:12px;height:12px;vertical-align:-1px}

/* Breed */
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.slot{aspect-ratio:1;max-width:100%;border-radius:20px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:13px;text-align:center;padding:8px;background:var(--surface)}
.slot.full{border-style:solid;border-color:var(--accent)}
.slot svg{width:80%}
.plus{font-family:var(--display);font-size:28px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.picks .card{width:auto}
.picks .card:disabled{opacity:.45;cursor:not-allowed}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.box dt{color:var(--muted);font-weight:800}
.box dd{margin:0;font-weight:700}
.shop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shop p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:999px}
.btn.block{width:100%;margin-top:12px;padding:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Atlas */
.atlas{display:grid;grid-template-columns:64px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.atlas .h{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.atlas .rh{text-align:left}
.cell{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.cell.unk{background:transparent;border:1.5px dashed var(--line);color:var(--line);font-family:var(--display);font-size:22px}
.cell svg{width:92%}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.legend b{font-variant-numeric:tabular-nums}

/* Economy */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.num b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.num span{font-size:12px;font-weight:800;color:var(--muted)}
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:800;font-size:13.5px}
.mats div b{margin-left:auto;font-variant-numeric:tabular-nums}
.burn{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:12px}
.burn div{height:100%;background:var(--accent)}
.burnlbl{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:6px}
.log{display:flex;flex-direction:column}
.log div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log b{font-variant-numeric:tabular-nums;white-space:nowrap}
.plus-n{color:var(--ok)} .minus-n{color:var(--heart)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800}
.toggle span small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.reset{background:none;border:0;color:var(--muted);font-weight:800;text-decoration:underline;cursor:pointer;padding:16px 0}
.reset.armed{color:var(--heart)}
.garden{display:flex;flex-wrap:wrap;gap:6px}
.garden span{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;padding:8px 0 9px;font-size:10.5px;font-weight:900;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-1.5px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--heart);border:2px solid var(--surface)}

/* Toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + 58px);z-index:9;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:16px;padding-right:16px}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin .25s ease-out}
.toast.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* Help */
.hl{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 50%,transparent)}
.qbtn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:900 12px var(--body);cursor:pointer;vertical-align:3px;margin-left:6px;padding:0}
.intro{background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:12px 14px;margin:14px 0 4px;display:flex;gap:12px;align-items:flex-start}
.intro p{margin:0;font-weight:700;font-size:14px;line-height:1.45;flex:1}
.intro p b{font-family:var(--display);font-weight:400;font-size:17px;display:block;margin-bottom:2px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.sheet-in{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(30px + env(safe-area-inset-bottom,0px))}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:1}
.sheet-hd b{font-family:var(--display);font-weight:400;font-size:26px}
.xbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font:900 18px var(--body);cursor:pointer}
.guide details{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:'+';font-size:20px;color:var(--muted)}
.guide details[open] summary::after{content:'–'}
.guide .gb{padding:0 14px 14px;font-size:14px;line-height:1.5}
.guide .gb p{margin:0 0 8px}
.guide .gb ul{margin:0 0 8px;padding-left:18px}
.guide .gb li{margin-bottom:4px}
.guide .gb b{color:var(--accent)}
.tipcard{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tipcard .coach-in{border:2px solid var(--accent)}
.tipcard h5{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--spark)}
.welcome{display:flex;flex-direction:column;min-height:100%;text-align:center}
.welcome .art{flex:none;width:min(240px,62vw);margin:18px auto 0}
.welcome .art svg{width:100%;height:auto;display:block}
.welcome .art.wide{display:flex;gap:6px;width:min(300px,80vw)}.welcome .art.wide>div{flex:1;min-width:0}
.welcome .art.room{width:min(300px,80vw);border-radius:20px;overflow:hidden;background:var(--stage);border:1.5px solid var(--line)}
.welcome h2{font-family:var(--display);font-weight:400;font-size:30px;margin:8px 0 6px;line-height:1.1;text-wrap:balance}
.welcome p{font-weight:700;font-size:15.5px;line-height:1.5;color:var(--muted);margin:0 auto 10px;max-width:36ch}
.welcome .pts{display:grid;gap:8px;text-align:left;margin:6px 0 10px}
.welcome .pts div{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.welcome .pts div b{color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:99px}
.wbtns{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.wbtns .btn{flex:1;padding:15px}

/* Sound button */
.sndbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.sndbtn svg{width:18px;height:18px}
/* Coach (tutorial) */
.coach{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:8;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.coach-in{max-width:456px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;animation:tin .25s ease-out}
.coach-in b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--spark)}
.coach-in p{margin:2px 0 8px;font-weight:800;font-size:14.5px;line-height:1.35}
.coach-row{display:flex;justify-content:space-between;align-items:center}
.coach-row .link{color:var(--bg);opacity:.7}
body.has-coach #app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.coach-target{position:relative;z-index:3;box-shadow:0 0 0 3px var(--accent),0 0 0 8px color-mix(in srgb,var(--accent) 30%,transparent)!important;animation:ring 1.4s ease-in-out infinite;border-radius:16px}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--accent),0 0 0 13px color-mix(in srgb,var(--accent) 10%,transparent)}}
/* Garden */
.gbar{display:flex;gap:8px;margin-top:12px}
.gbar .btn{flex:1}
.bedinfo{margin-top:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.bedinfo h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:18px}
.bedinfo .st{font-weight:800;font-size:13px;color:var(--muted)}
.bedinfo .opt{padding:8px 4px}
.ready-mark{animation:mk 1.2s ease-in-out infinite}
.rtitle.sky,.rtitle.sky small{color:#2F4A2A}.rtitle.sky.night,.rtitle.sky.night small{color:#F4ECDD}

@media (prefers-reduced-motion: reduce){
  .bob,.halo,.wobble,.orb,.heart,.coins.bump,.toast,.lampglow,.marker,.coach-target,.ready-mark{animation:none!important}
  .orb{opacity:1}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Lumiki<small id="sub">cozy pets</small></div>
    <div class="wallet"><button class="sndbtn" id="helpBtn" aria-label="Guide" data-guide="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg></button><button class="sndbtn" id="snd" aria-label="Sound on or off"></button><span class="speed" id="speedTag" hidden>×60</span><div class="coins dust" data-help="dust" style="cursor:help"><i>✧</i><span id="dustN">0</span></div><div class="coins" id="coins" data-help="sparks" style="cursor:help"><i>✦</i><span id="coinN">0</span></div></div>
  </header>

  <main>
    <section id="tab-home">
      <div class="rooms" id="roomsBar"></div>
      <div class="roomcard" id="hab"></div>
      <div class="stats" id="stats"></div>
      <div class="actions" id="actions"></div>
      <div id="panel"></div>
      <div id="info"></div>
      <h3 class="sec">Your lumiks<button class="qbtn" data-guide="grow" aria-label="Help">?</button></h3>
      <div class="strip" id="strip"></div>
    </section>
    <section id="tab-tasks" hidden></section>
    <section id="tab-decor" hidden></section>
    <section id="tab-breed" hidden></section>
    <section id="tab-atlas" hidden></section>
    <section id="tab-eco" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>Home</button>
    <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="15" height="17" rx="2.5"/><path d="M8.5 9.5l1.5 1.5 3-3M8.5 15.5h7"/></svg>Tasks<span class="dot" id="taskDot" hidden></span></button>
    <button data-tab="decor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h8l3 7H5z"/><path d="M12 10v8"/><path d="M8 21h8"/></svg>Decor</button>
    <button data-tab="breed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="13" rx="6.5" ry="8"/><path d="M8 12l2.5 2 2-3 2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Pairs</button>
    <button data-tab="atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M13 4h5.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z"/></svg>Atlas</button>
    <button data-tab="eco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="currentColor" stroke="none"/></svg>Stash</button>
  </div>
</nav>
<div id="toasts" aria-live="polite"></div>

<script>
/* ================= catalogs ================= */
const EL={fire:{n:'Fire',hue:18,w:25,r:0},water:{n:'Water',hue:205,w:25,r:0},leaf:{n:'Leaf',hue:118,w:25,r:0},crystal:{n:'Crystal',hue:182,w:15,r:2},shadow:{n:'Shadow',hue:275,w:10,r:3}};
const PAT={none:{n:'Plain',w:35,r:0},spots:{n:'Spots',w:25,r:1},stripes:{n:'Stripes',w:25,r:1},stars:{n:'Stars',w:15,r:3}};
const EARS={round:{n:'Round ears',w:30,r:0},pointy:{n:'Pointy ears',w:30,r:0},horns:{n:'Horns',w:25,r:1},antennae:{n:'Antennae',w:15,r:2}};
const TR={el:EL,pat:PAT,ears:EARS};
const RAR=[{n:'Common',m:1},{n:'Rare',m:1.3},{n:'Epic',m:1.7},{n:'Legendary',m:2.5}];
const STAGES=['baby','teen','adult','elder'];
const ELDER_AGE=30*86400, ROOM_CAP=3, MUT=0.08, KEY='lumiki-v1';
const COST={breed:40,egg:60,rareEgg:3,lupa:1,freeze:60};
const SKILLS={agi:'Agility',wit:'Wits',sta:'Stamina'};

const MATS={berry:{n:'Berries',c:'#C2416B'},shell:{n:'Shells',c:'#F0B48E'},mush:{n:'Glowshrooms',c:'#8A7FD6'},crystal:{n:'Crystals',c:'#4FC3D6'}};
const FOODS={
  basic:{n:'Food',d:'+28 fullness',cost:{coins:3},h:28,j:4,e:0,xp:4},
  pie:{n:'Berry pie',d:'+45 fullness, +20 joy',cost:{berry:3},h:45,j:20,e:0,xp:8},
  soup:{n:'Mushroom soup',d:'+30 fullness, +35 energy',cost:{mush:2},h:30,j:5,e:35,xp:8},
  candy:{n:'Crystal candy',d:'+30 joy, +50 energy',cost:{crystal:1},h:10,j:30,e:50,xp:12}
};
const GAMES={
  firefly:{n:'Catch fireflies',d:'10 seconds · agility',skill:'agi',e:20},
  memory:{n:'Find the pairs',d:'40 seconds · wits',skill:'wit',e:20},
  runner:{n:'Puddle jump',d:'up to 25 seconds · stamina',skill:'sta',e:20},
  tidy:{n:'Tidy the room',d:'+5 cozy for 12 hours',skill:null,e:10}
};
const LOCS={
  meadow:{n:'Meadow',sec:900,lvl:1,minStage:1,skill:null,req:0,e:15,h:10,coins:[10,20],mats:{berry:[2,4]},egg:.05,eggEl:null,dust:0,xp:5},
  lake:{n:'Lake',sec:3600,lvl:2,minStage:2,skill:'sta',req:15,e:25,h:15,coins:[25,45],mats:{shell:[2,3],berry:[0,1]},egg:.1,eggEl:'water',dust:0,xp:10},
  forest:{n:'Dark forest',sec:14400,lvl:4,minStage:2,skill:'wit',req:25,e:35,h:25,coins:[60,100],mats:{mush:[2,3]},egg:.15,eggEl:'shadow',dust:.05,xp:20},
  caves:{n:'Crystal caves',sec:28800,lvl:6,minStage:2,skill:'agi',req:35,e:45,h:30,coins:[120,180],mats:{crystal:[1,2]},egg:.2,eggEl:'crystal',dust:.15,xp:40}
};
const QUESTS=[
  {t:'play',n:'Play mini-games',need:2},{t:'feed',n:'Feed your lumiks',need:3},{t:'trip',n:'Send a lumik exploring',need:1},
  {t:'pet',n:'Pet your lumiks',need:10},{t:'decor',n:'Buy a decor item',need:1},{t:'treat',n:'Give a treat',need:1},
  {t:'tidy',n:'Tidy a room',need:1},{t:'sleep',n:'Put a lumik to bed',need:1},{t:'skill',n:'Raise skills',need:3},{t:'water',n:'Water the garden',need:2,lvl:6},{t:'harvest',n:'Harvest a plant',need:1,lvl:6}
];
const XP_T=[0,0,60,150,280,450,660,920,1230,1600,2030,2520,3080,3710,4410,5180,6030,6960,7980,9090,10300];
const UNLOCKS={2:'Lake',3:'Second room',4:'Dark forest',6:'Crystal caves + garden',8:'Third room',9:'2 more garden beds',12:'Fourth room'};
const roomsFor=l=>l>=12?4:l>=8?3:l>=3?2:1;
const ROOM_NAMES=['Living room','Bedroom','Nursery','Attic'];

const SLOTS={wall:'Wallpaper',floor:'Floor',rug:'Rug',bed:'Bed',corner:'Corner',big:'Furniture',pic:'Picture',shelf:'Shelf',toy:'Toy'};
const ITEMS={
  w_cream:{slot:'wall',n:'Cream wallpaper',price:0,c:0},
  w_mint:{slot:'wall',n:'Mint stripes',price:25,c:2},
  w_berry:{slot:'wall',n:'Strawberry dots',price:30,c:2},
  w_wood:{slot:'wall',n:'Wood panels',price:35,c:3},
  w_star:{slot:'wall',n:'Starry night',price:45,c:5,mat:{crystal:2}},
  f_planks:{slot:'floor',n:'Plank floor',price:0,c:0},
  f_carpet:{slot:'floor',n:'Soft carpet',price:25,c:2},
  f_check:{slot:'floor',n:'Checker tiles',price:30,c:2},
  rug_round:{slot:'rug',n:'Round rug',price:15,c:2},
  rug_stripe:{slot:'rug',n:'Striped runner',price:20,c:2},
  rug_cloud:{slot:'rug',n:'Cloud rug',price:35,c:5,mat:{berry:4}},
  bed_pillow:{slot:'bed',n:'Cushion',price:20,c:3},
  bed_basket:{slot:'bed',n:'Basket bed',price:45,c:6},
  c_cactus:{slot:'corner',n:'Cactus',price:12,c:1},
  c_ficus:{slot:'corner',n:'Ficus',price:22,c:3},
  c_lamp:{slot:'corner',n:'Floor lamp',price:30,c:5,mat:{mush:2},note:'glows at night'},
  big_books:{slot:'big',n:'Bookcase',price:50,c:6},
  big_aqua:{slot:'big',n:'Aquarium',price:70,c:9,mat:{shell:4}},
  pic_poster:{slot:'pic',n:'Lumik poster',price:15,c:2},
  pic_mount:{slot:'pic',n:'Mountain painting',price:22,c:2},
  shelf_books:{slot:'shelf',n:'Book shelf',price:20,c:2},
  shelf_clock:{slot:'shelf',n:'Cuckoo clock',price:28,c:3},
  toy_ball:{slot:'toy',n:'Ball',price:10,c:1},
  toy_yarn:{slot:'toy',n:'Yarn ball',price:12,c:2}
};
const CROP={wall:'0 22 320 240',floor:'0 22 320 240',rug:'92 180 156 117',bed:'22 160 120 90',corner:'88 102 92 69',big:'168 92 100 75',pic:'88 66 72 54',shelf:'176 72 112 84',toy:'212 196 64 48'};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=v=>Math.max(0,Math.min(100,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};
const fmtSec=sec=>sec>=3600?`${sec/3600} h`:`${sec/60} min`;
const pickW=o=>{let t=0;for(const k in o)t+=o[k].w;let r=Math.random()*t;for(const k in o){r-=o[k].w;if(r<=0)return k}return Object.keys(o)[0]};
const rarity=g=>{const s=EL[g.el].r+PAT[g.pat].r+EARS[g.ears].r+(g.glow?2:0);return s>=6?3:s>=4?2:s>=2?1:0};
const stage=p=>p.xp>=80?((p.age||0)>=ELDER_AGE?3:2):p.xp>=30?1:0;
const adult=p=>stage(p)>=2;
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const art=w=>(/^[aeiou]/i.test(w)?'an ':'a ')+w;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GS=()=>S.speed||1;
const durMs=sec=>sec*1000/GS();
const randName=()=>{const a=['Lu','Mi','Pi','Bo','Ku','Zi','Ra','Nu','To','Fe','Shu','Ko','Da','Ti'],b=['sha','mik','ka','pi','nya','sy','ki','ro','fa','li','bo','tu'];return a[Math.random()*a.length|0]+b[Math.random()*b.length|0]};
const matIcon=k=>`<svg class="mi" viewBox="0 0 12 12"><path d="${k==='berry'?'M6 2.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7z':k==='shell'?'M6 1.5l4.5 6.5h-9z':k==='mush'?'M1.5 6a4.5 4 0 0 1 9 0zM4.5 6h3v4h-3z':'M6 1l3 4-3 6-3-6z'}" fill="${MATS[k].c}"/></svg>`;
const costHtml=c=>Object.entries(c).filter(([,v])=>v).map(([k,v])=>k==='coins'?`${v} ✦`:k==='dust'?`${v} ✧`:`${v}${matIcon(k)}`).join(' + ');
const roomOf=p=>S.rooms.find(r=>r.id===p.roomId)||S.rooms[0];
const petsIn=r=>S.pets.filter(p=>!p.egg&&p.roomId===r.id);
const curRoom=()=>S.rooms.find(r=>r.id===S.roomSel)||S.rooms[0];
const pet=id=>S.pets.find(p=>p.id===id);
const sel=()=>pet(S.selected)||S.pets.find(p=>!p.egg)||S.pets[0];

let S, tab='home', panel=null, game=null, breedSel=[], svgSeq=0, lastPet=0, decorCat='wall';

/* ================= state ================= */
function newRoom(){const n=S?S.rooms.length:0;return{id:(S?Math.max(0,...S.rooms.map(r=>r.id)):0)+1,name:ROOM_NAMES[n]||('Room '+(n+1)),decor:{wall:'w_cream',floor:'f_planks'},inv:['w_cream','f_planks'],tidyUntil:0}}
const skillsRnd=()=>({agi:irand(5,12),wit:irand(5,12),sta:irand(5,12)});
function genesRnd(el){
  const g={h:{}};for(const t in TR){const a=t==='el'&&el?el:pickW(TR[t]),b=pickW(TR[t]);const [v,h]=dominance(t,a,b);g[t]=v;g.h[t]=h}
  g.hue=Math.round((EL[g.el].hue+rand(-30,30)+360)%360);g.glow=Math.random()<0.03;return g;
}
function initial(){
  const now=Date.now();
  const st={v:2,coins:120,dust:1,earned:120,spent:0,nextId:4,selected:1,roomSel:1,lastTick:now,atlas:{},speed:1,dayOffset:0,

function logOp(n,why,unit){S.log.unshift({n,why,u:unit||'✦',t:Date.now()});S.log.length=Math.min(S.log.length,40)}
let lastCoin=0;function earn(n,why){n=Math.round(n);if(n<=0)return;S.coins+=n;S.earned+=n;logOp(n,why);bump('#coins');const t=Date.now();if(t-lastCoin>250){lastCoin=t;sfx('coin')}}

function pay(c,why){
  if(!canPay(c)){const miss=Object.entries(c).filter(([k,v])=>k==='coins'?S.coins<v:k==='dust'?S.dust<v:(S.mats[k]||0)<v).map(([k])=>k==='coins'?'Sparks':k==='dust'?'Stardust':MATS[k].n.toLowerCase());
    haptic('n','error');toast(`Not enough: ${miss.join(', ')}`);return false}
  for(const [k,v] of Object.entries(c)){if(!v)continue;if(k==='coins'){S.coins-=v;S.spent+=v;logOp(-v,why)}else if(k==='dust'){S.dust-=v;logOp(-v,why,'✧');bump('.coins.dust')}else S.mats[k]-=v}
  if(c.coins)bump('#coins');return true;
}

function dayNum(){const t=Date.now()+(S.dayOffset||0)*864e5;return Math.floor((t-new Date().getTimezoneOffset()*6e4)/864e5)}

function ensureDay(){
  const d=dayNum();if(S.daily&&S.daily.day===d)return false;
  const r=seeded(d*7919),pool=QUESTS.filter(q=>!q.lvl||houseLvl()>=q.lvl);for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  S.daily={day:d,quests:pool.slice(0,3).map(q=>({t:q.t,need:q.need,have:0,claimed:false})),chest:false};return true;
}

function dominance(t,a,b){const ra=TR[t][a].r,rb=TR[t][b].r;if(ra<rb)return[a,b];if(rb<ra)return[b,a];return Math.random()<.5?[a,b]:[b,a]}
function mixGenes(A,B){
  const g={h:{}},al=(P,t)=>Math.random()<.5?P.genes[t]:P.genes.h[t];
  for(const t in TR){let a=al(A,t),b=al(B,t);if(Math.random()<MUT)a=pickW(TR[t]);if(Math.random()<MUT)b=pickW(TR[t]);const [v,h]=dominance(t,a,b);g[t]=v;g.h[t]=h}
  const d=((B.genes.hue-A.genes.hue+540)%360)-180;g.hue=Math.round((A.genes.hue+d/2+rand(-25,25)+360)%360);
  g.glow=(A.genes.glow||B.genes.glow)?Math.random()<.35:Math.random()<.05;return g;
}
function forecast(A,B,t){
  const out={},add=(k,p)=>out[k]=(out[k]||0)+p;
  for(const a of [A.genes[t],A.genes.h[t]])for(const b of [B.genes[t],B.genes.h[t]]){const ra=TR[t][a].r,rb=TR[t][b].r;if(ra<rb)add(a,.25);else if(rb<ra)add(b,.25);else{add(a,.125);add(b,.125)}}
  return Object.entries(out).sort((x,y)=>y[1]-x[1]).map(([k,p])=>`${TR[t][k].n} ${Math.round(p*100)}%`).join(' · ');
}

const mood=p=>p.sleeping?'z':(p.joy<30||p.hunger<20)?'sad':'ok';
function tick(){
  const now=Date.now();const prev=S.lastTick;const raw=Math.max(0,(now-S.lastTick)/1000);S.lastTick=now;const dt=Math.min(raw,43200),g=dt*GS();
  let changed=ensureDay();
  for(const p of S.pets){
    if(p.egg){if(!p.ready&&now>=p.hatchAt){p.ready=true;changed=true;toast('An egg cracked — ready to hatch!')}continue}
    if(p.restUntil&&now>=p.restUntil){p.restUntil=0;changed=true}
    const st0=stage(p);p.age=(p.age||0)+raw*GS();if(stage(p)!==st0){changed=true;if(stage(p)===3)toast(`${p.name} became an elder`)}
    if(p.awayUntil){if(now>=p.awayUntil){finishTrip(p);changed=true}continue}
    const m0=mood(p);
    p.hunger=clamp(p.hunger-g*100/57600);
    p.joy=clamp(p.joy-g*(p.hunger<20?2:1)*100/86400*(1-cozy(roomOf(p))));
    if(p.sleeping){p.energy=clamp(p.energy+g*100/3600);if(p.energy>=100){p.sleeping=false;changed=true;toast(`${p.name} is fully rested`)}}
    else p.energy=clamp(p.energy+g*10/3600);
    if(mood(p)!==m0)changed=true;
  }
  for(const r of S.rooms)if(r.tidyUntil&&now>=r.tidyUntil){r.tidyUntil=0;changed=true}
  if(gardenTick(now,prev,raw))changed=true;
  const per=period();if(per!==S._per){S._per=per;changed=true}
  if(changed){save();renderAll()}else renderLive();
}

  S.roomSel=room.id;const isNew=discover(p);addHouseXp(15);haptic('n','success','hatch');tutEvent('hatch');

function tripCheck(p,k){
  const L=LOCS[k];

  if(stage(p)===3)return'elders stay home';
  if(stage(p)<L.minStage)return L.minStage===1?'needs a teen or older':'needs an adult';
  if(L.skill&&p.skills[L.skill]<L.req)return`${SKILLS[L.skill].toLowerCase()} ${p.skills[L.skill]}/${L.req}`;
  if(p.sleeping)return'wake them up first';

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function noise(t0,dur,vol,freq){const a=AC;if(!a)return;const t=a.currentTime+t0,len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=.8;g.gain.value=vol;src.connect(bp);bp.connect(g);g.connect(master);src.start(t)}

function ensureGarden(){const n=bedsFor(houseLvl());if(!n)return;S.garden=S.garden||{beds:[]};while(S.garden.beds.length<n)S.garden.beds.push({plant:null,grown:0,wetUntil:0})}
const bedReady=b=>b.plant&&b.grown>=SEEDS[b.plant].sec;
function gardenTick(now,prev,raw){
  if(!S.garden)return false;let ch=false;
  for(const b of S.garden.beds){if(!b.plant||bedReady(b))continue;
    const wetMs=Math.max(0,Math.min(now,b.wetUntil)-Math.max(prev,now-raw*1000));
    if(wetMs>0){b.grown=Math.min(SEEDS[b.plant].sec,b.grown+wetMs/1000*GS());if(bedReady(b)){ch=true;toast(`${SEEDS[b.plant].n} is ready to harvest`)}}
    if(b.wetUntil&&now>=b.wetUntil&&!b.dry){b.dry=true;ch=true}}
  return ch;
}
function plant(i,k){const b=S.garden.beds[i],sd=SEEDS[k];if(!b||b.plant)return;if(!pay(sd.cost,`Seeds: ${sd.n}`))return;
  Object.assign(b,{plant:k,grown:0,wetUntil:Date.now()+durMs(WET),dry:false});haptic('i','light','dig');toast(`${sd.n} planted and watered`);done()}
function water(i){const b=S.garden.beds[i];if(!b||!b.plant||bedReady(b))return;if(b.wetUntil-Date.now()>durMs(WET)*.75)return toast('Still wet — water it a bit later');
  b.wetUntil=Date.now()+durMs(WET);b.dry=false;progress('water');haptic('i','light','water');done()}
function harvest(i){const b=S.garden.beds[i];if(!b||!bedReady(b))return;const sd=SEEDS[b.plant],parts=[];
  for(const [k,[lo,hi]] of Object.entries(sd.give)){const v=irand(lo,hi);if(k==='coins'){earn(v,`Garden: ${sd.n}`);parts.push(`${v} ✦`)}else{addMats({[k]:v});parts.push(`${v} ${MATS[k].n.toLowerCase()}`)}}
  if(sd.dust&&Math.random()<sd.dust){addDust(1,`Garden: ${sd.n}`);parts.push('1 ✧')}
  Object.assign(b,{plant:null,grown:0,wetUntil:0,dry:false});addHouseXp(8);progress('harvest');haptic('n','success','chime');toast(`Harvest: ${parts.join(', ')}`);done()}
function waterAll(){let n=0;S.garden.beds.forEach(b=>{if(b.plant&&!bedReady(b)&&b.wetUntil-Date.now()<=durMs(WET)*.75){b.wetUntil=Date.now()+durMs(WET);b.dry=false;n++}});
  if(!n)return toast('Nothing needs water right now');progress('water',n);haptic('i','light','water');toast(`Watered ${n} ${n===1?'bed':'beds'}`);done()}
function harvestAll(){const idx=S.garden.beds.map((b,i)=>bedReady(b)?i:-1).filter(i=>i>=0);if(!idx.length)return toast('Nothing is ready yet');idx.forEach(harvest)}
function plantSVG(b){
  const sd=b.plant,f=b.grown/SEEDS[sd].sec,stg=f>=1?2:f>=.34?1:0;
  if(stg===0)return `<path d="M0 0 V-8" stroke="#3E8A3A" stroke-width="2"/><ellipse cx="-4" cy="-9" rx="4" ry="2.4" fill="#5EB24E" transform="rotate(-25 -4 -9)"/><ellipse cx="4" cy="-10" rx="4" ry="2.4" fill="#6EC25A" transform="rotate(25 4 -10)"/>`;
  if(sd==='sun')return `<path d="M0 0 V${stg===2?-40:-26}" stroke="#3E8A3A" stroke-width="3"/><ellipse cx="-7" cy="-14" rx="7" ry="3.5" fill="#5EB24E"/><ellipse cx="7" cy="-20" rx="7" ry="3.5" fill="#5EB24E"/>`+(stg===2?`<g transform="translate(0 -42)">${[...Array(10)].map((_,i)=>`<ellipse cx="0" cy="-10" rx="4" ry="8" fill="#F7C93B" transform="rotate(${i*36})"/>`).join('')}<circle r="7" fill="#8A5A2B"/></g>`:`<ellipse cx="0" cy="-29" rx="5" ry="7" fill="#7CC35E"/>`);
  if(sd==='berry'){const r=stg===2?15:11;return `<circle cx="-8" cy="${-r}" r="${r*.8}" fill="#3E8A3A"/><circle cx="8" cy="${-r}" r="${r*.8}" fill="#4A9B42"/><circle cx="0" cy="${-r*1.5}" r="${r*.85}" fill="#5EB24E"/>`+(stg===2?[[-9,-14],[6,-20],[-2,-26],[10,-10],[-12,-22]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#D93A5E"/>`).join(''):'')}
  if(sd==='shroom'){const h=stg===2?22:14;return `${stg===2?`<circle cx="0" cy="${-h}" r="20" fill="#C9B8FF" opacity=".35"/>`:''}<rect x="-3" y="${-h}" width="6" height="${h}" rx="2" fill="#F4ECDD"/><path d="M-13 ${-h+2} a13 11 0 0 1 26 0Z" fill="#8A7FD6"/><circle cx="-5" cy="${-h-4}" r="2" fill="#E9E3FF"/><circle cx="4" cy="${-h-6}" r="1.6" fill="#E9E3FF"/><rect x="10" y="-9" width="4" height="9" rx="2" fill="#F4ECDD"/><path d="M6 -8 a6 5 0 0 1 12 0Z" fill="#A497E8"/>`}
  const k=stg===2?1:.65;return `<g transform="scale(${k})"><polygon points="0,-36 7,-18 3,0 -3,0 -7,-18" fill="#9FE6EF" stroke="#3FAFC2" stroke-width="1.5"/><polygon points="-12,-22 -6,-12 -8,0 -13,0 -16,-12" fill="#BDEFF5" stroke="#3FAFC2" stroke-width="1.5"/><polygon points="12,-24 16,-12 13,0 8,0 6,-12" fill="#BDEFF5" stroke="#3FAFC2" stroke-width="1.5"/></g>`+(stg===2?`<polygon points="${star(14,-34,5)}" fill="#FFF4C4"/>`:'');
}
function gardenSVG(){
  const per=period(),sky={night:'#24305C',dawn:'#FFD8B4',day:'#BFE6F5',dusk:'#F6B79C'}[per];
  let s=`<svg class="room" viewBox="0 -16 320 296" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Garden"><rect x="0" y="-20" width="320" height="320" fill="${sky}"/>`;
  if(per==='night')[[40,10],[90,30],[250,20],[290,50],[200,0]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="1.6" fill="#fff"/>`);
  else s+=`<circle cx="268" cy="20" r="16" fill="${per==='day'?'#FFE58A':'#FFC48A'}"/><ellipse cx="70" cy="30" rx="26" ry="9" fill="#fff" opacity=".85"/>`;
  s+=`<ellipse cx="60" cy="140" rx="90" ry="40" fill="#8FBF73"/><ellipse cx="270" cy="135" rx="80" ry="34" fill="#9CCB7E"/>`;
  s+=`<g transform="${FL}"><rect width="140" height="140" fill="#9CCB74"/>${[...Array(40)].map((_,i)=>`<path d="M${(i*37)%140} ${(i*53)%140} l2 -4 l2 4" stroke="#7FB25C" stroke-width="1.2" fill="none"/>`).join('')}</g>`;
  for(let i=0;i<=7;i++){const [x,y]=fp(i*20,0),[x2,y2]=fp(0,i*20);s+=`<rect x="${x-2}" y="${y-22}" width="4" height="22" fill="#C99A6B"/><rect x="${x2-2}" y="${y2-22}" width="4" height="22" fill="#C99A6B"/>`}
  s+=`<path d="M${fp(0,0)[0]} ${fp(0,0)[1]-16} L${fp(140,0)[0]} ${fp(140,0)[1]-16} M${fp(0,0)[0]} ${fp(0,0)[1]-8} L${fp(140,0)[0]} ${fp(140,0)[1]-8} M${fp(0,0)[0]} ${fp(0,0)[1]-16} L${fp(0,140)[0]} ${fp(0,140)[1]-16} M${fp(0,0)[0]} ${fp(0,0)[1]-8} L${fp(0,140)[0]} ${fp(0,140)[1]-8}" stroke="#B5845A" stroke-width="3"/>`;
  const order=S.garden.beds.map((b,i)=>i).sort((a,b)=>(BEDS[a][0]+BEDS[a][1])-(BEDS[b][0]+BEDS[b][1]));
  for(const i of order){const b=S.garden.beds[i],[p,q]=BEDS[i],wet=b.plant&&b.wetUntil>Date.now();
    s+=`<g class="tap" data-bed="${i}">`+isoBox(p,q,32,32,7,0,[wet?'#6B4A2E':'#B88D5F','#8E6440','#7A5434']);
    if(i===bedSel)s+=`<polygon points="${pts([fp(p,q),fp(p+32,q),fp(p+32,q+32),fp(p,q+32)].map(([x,y])=>[x,y-7]))}" fill="none" stroke="#E5654F" stroke-width="2.5"/>`;
    const [cx,cy]=fp(p+16,q+16);
    if(b.plant)s+=`<g transform="translate(${cx} ${cy-7})">${plantSVG(b)}</g>`;
    if(bedReady(b))s+=`<g class="ready-mark"><circle cx="${cx+16}" cy="${cy-52}" r="9" fill="#E5654F"/><polygon points="${star(cx+16,cy-52,5)}" fill="#fff"/></g>`;
    else if(b.plant&&!wet)s+=`<g><circle cx="${cx+16}" cy="${cy-38}" r="8" fill="#3F86B8"/><path d="M${cx+16} ${cy-43} q-4 5 -3 7 a3 3 0 0 0 6 0 q1 -2 -3 -7Z" fill="#fff"/></g>`;
    s+=`</g>`}
  if(per==='night')s+=`<rect x="0" y="-20" width="320" height="320" fill="#141838" opacity=".3"/>`;
  return s+'</svg>';
}
function renderGarden(){
  const h=$('#hab'),beds=S.garden.beds;if(bedSel>=beds.length)bedSel=0;const b=beds[bedSel];
  const ready=beds.filter(bedReady).length,dry=beds.filter(x=>x.plant&&!bedReady(x)&&x.wetUntil<=Date.now()).length;
  h.innerHTML=`<div class="room-head"><div class="rtitle sky${period()==='night'?' night':''}">Garden<small>${beds.filter(x=>x.plant).length} of ${beds.length} beds planted</small></div></div>${gardenSVG()}
    <div class="status"><span>${ready?`${ready} ready to harvest`:dry?`${dry} ${dry===1?'bed needs':'beds need'} water`:'Tap a bed to plant or water'}</span></div>`;
  h.querySelectorAll('[data-bed]').forEach(g=>g.addEventListener('click',()=>{bedSel=+g.dataset.bed;haptic('s');renderGarden()}));
  let info='';
  if(!b.plant){info=`<h4>Bed ${bedSel+1} · empty</h4><div class="st">Pick seeds. Planting waters the bed for 4 hours.</div>`+Object.entries(SEEDS).map(([k,sd])=>`<button class="opt${canPay(sd.cost)?'':' off'}" data-seed="${k}"><span class="ico"><svg viewBox="-20 -46 40 50">${plantSVG({plant:k,grown:SEEDS[k].sec})}</svg></span><span class="t"><b>${sd.n}</b><span>${sd.d}</span></span><span class="go">${costHtml(sd.cost)}</span></button>`).join('')}
  else{const sd=SEEDS[b.plant],rd=bedReady(b),wet=b.wetUntil>Date.now();
    info=`<h4>Bed ${bedSel+1} · ${sd.n}</h4><div class="st">${rd?'Ready to harvest!':`Grown <b data-grow="${bedSel}">${Math.floor(b.grown/sd.sec*100)}%</b> · ${wet?`water lasts <b data-until="${b.wetUntil}">${fmt(b.wetUntil-Date.now())}</b>`:'dry — it stops growing until you water it'}`}</div>
      <div class="gbar">${rd?`<button class="btn" id="bHarv">Harvest</button>`:`<button class="btn${wet?' ghost':''}" id="bWater">Water</button>`}</div>`}
  $('#info').innerHTML=`${intro('garden')}<div class="bedinfo">${info}</div><div class="gbar"><button class="btn ghost" id="wAll">Water all</button><button class="btn ghost" id="hAll">Harvest all</button></div>
    <p class="lead" style="margin-top:10px">Plants grow only while the soil is wet. Watering lasts 4 hours, so come back to keep them growing.</p>`;
  document.querySelectorAll('[data-seed]').forEach(x=>x.addEventListener('click',()=>plant(bedSel,x.dataset.seed)));
  const bw=$('#bWater');bw&&bw.addEventListener('click',()=>water(bedSel));const bh=$('#bHarv');bh&&bh.addEventListener('click',()=>harvest(bedSel));
  $('#wAll').addEventListener('click',waterAll);$('#hAll').addEventListener('click',harvestAll);
}

    <div class="roomcard">${roomSVG(r.decor,{subject:roomSubjects(r,{}),mess:!r.tidyUntil&&petsIn(r).length>0})}</div>
    <div class="comfort"><b>${c}</b><div><strong>Cozy${r.tidyUntil>Date.now()?' (tidy +5)':''}</strong> — +${bonus}% Sparks for lumiks in this room, and joy drops ${bonus}% slower. Max +60%.</div></div>
    <div class="cats">${Object.entries(SLOTS).map(([k,n])=>`<button class="cat" data-c="${k}" aria-pressed="${k===decorCat}">${n}</button>`).join('')}</div>
    <div class="items">${list.map(([id,it])=>{const on=r.decor[it.slot]===id,own=r.inv.includes(id);
      const r2={wall:r.decor.wall,floor:r.decor.floor,[it.slot]:id};
      return `<button class="item${on?' on':''}" data-i="${id}"><div class="th">${roomSVG(r2,{crop:CROP[it.slot]})}</div><div class="nm">${it.n}</div>
        <div class="meta"><span>cozy +${it.c}${it.note?' · '+it.note:''}</span><span class="price">${on?(it.slot==='wall'||it.slot==='floor'?'in use':'remove'):own?'place':it.price||it.mat?costHtml({coins:it.price,...(it.mat||{})}):'free'}</span></div></button>`}).join('')}</div>`;
  el.querySelectorAll('#decRooms [data-r]').forEach(b=>b.addEventListener('click',()=>{S.roomSel=+b.dataset.r;renderDecor()}));
  el.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{decorCat=b.dataset.c;renderDecor()}));
  el.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>useItem(b.dataset.i)));
}
function renderBreed(){
  const el=$('#tab-breed'),[a,b]=breedSel.map(pet);
  const slot=p=>p?`<div class="slot full">${petSVG(p,{})}</div>`:`<div class="slot">Pick an adult</div>`;
  const cand=S.pets.filter(p=>!p.egg);
  let fc='';
  if(a&&b){const both=a.revealed&&b.revealed,leg=rarity(a.genes)===3&&rarity(b.genes)===3;
    const row=(t,n)=>`<dt>${n}</dt><dd>${both?forecast(a,b,t):[...new Set([TR[t][a.genes[t]].n,TR[t][b.genes[t]].n])].join(' or ')+' · plus hidden genes'}</dd>`;
    fc=`<div class="box"><dl>${row('el','Element')}${row('pat','Pattern')}${row('ears','Ears')}
      <dt>Mutation</dt><dd>${MUT*100}% per gene</dd><dt>Glow</dt><dd>${a.genes.glow||b.genes.glow?'35%':'5%'}</dd><dt>Generation</dt><dd>${Math.max(a.gen||1,b.gen||1)+1}${leg?' · a legendary pair continues the line':''}</dd></dl>
      ${both?'':`<p class="muted" style="font-size:12.5px;font-weight:700;margin:10px 0 0">Rare traits hide: a common gene beats a rare one. Use the magnifier on both parents to see exact odds.</p>`}</div>`}
  const ok=a&&b&&!canBreed(a)&&!canBreed(b),legPair=a&&b&&rarity(a.genes)===3&&rarity(b.genes)===3;
  el.innerHTML=`${intro('breed')}<h3 class="sec">Pairs${qb('genes')}</h3><p class="lead">Every lumik carries visible and hidden genes. A baby gets one gene from each parent. A common gene beats a rare one, so a rare trait shows only when both of the baby’s genes are rare.</p>
    <div class="pair">${slot(a)}<span class="plus">+</span>${slot(b)}</div>${fc}
    <button class="btn block" id="doBreed" ${ok?'':'disabled'}>Pair up · ${COST.breed} ✦${legPair?' + 2 ✧':''}</button>
    <h3 class="sec">Choose parents</h3>
    <div class="picks">${cand.map(p=>{const why=canBreed(p);return`<button class="card" data-id="${p.id}" aria-pressed="${breedSel.includes(p.id)}" ${why?'disabled':''}>${petSVG(p,{})}<div class="nm">${esc(p.name)}</div><div class="st">${why==='resting'?`rest <span data-until="${p.restUntil}">${fmt(p.restUntil-Date.now())}</span>`:why||RAR[rarity(p.genes)].n}</div></button>`}).join('')}</div>
    <h3 class="sec">Shop</h3>
    <div class="box shop"><div><b>Mystery egg</b><p>Usually a common lumik. Hatches in 10 minutes.</p></div><button class="btn" id="buyEgg">${COST.egg} ✦</button></div>
    <div class="box shop"><div><b>Rare egg</b><p>An epic lumik or better. Hatches in 20 minutes.</p></div><button class="btn" id="buyRare">${COST.rareEgg} ✧</button></div>`;
  el.querySelectorAll('.picks .card').forEach(c=>c.addEventListener('click',()=>toggleBreed(+c.dataset.id)));
  $('#doBreed').addEventListener('click',breed);$('#buyEgg').addEventListener('click',()=>buyEgg(false));$('#buyRare').addEventListener('click',()=>buyEgg(true));
}
function renderAtlas(){
  const el=$('#tab-atlas'),found=Object.keys(S.atlas).length,tot=Object.keys(EL).length*Object.keys(PAT).length;
  let g=`<div></div>`+Object.values(PAT).map(p=>`<div class="h">${p.n}</div>`).join('');
  for(const e in EL){g+=`<div class="h rh">${EL[e].n}</div>`;for(const pt in PAT){const a=S.atlas[e+'-'+pt];
    g+=a?`<div class="cell" title="${EL[e].n}, ${PAT[pt].n}">${petSVG({genes:a,xp:100,joy:80,hunger:80},{})}</div>`:`<div class="cell unk" aria-label="Not found yet">?</div>`}}
  el.innerHTML=`${intro('atlas')}<h3 class="sec">Atlas · ${found} of ${tot}${qb('atlas')}</h3><p class="lead">Every element + pattern combo is its own entry. The bottom rows and the Stars column are the rarest.</p>
    <div class="atlas">${g}</div>
    <h3 class="sec">Rarity and earnings multiplier</h3>
    <div class="legend">${RAR.map((r,i)=>`<div class="r${i}">${r.n}<b>×${r.m}</b></div>`).join('')}</div>`;
}
function renderEco(){
  const el=$('#tab-eco'),pct=S.earned?Math.round(S.spent/S.earned*100):0,el_=elders();
  el.innerHTML=`${intro('eco')}<h3 class="sec">Stash${qb('money')}</h3>
    <div class="nums"><div class="num"><b>${S.coins}</b><span>✦ Sparks</span></div><div class="num"><b>${S.dust}</b><span>✧ Stardust</span></div><div class="num"><b>${houseLvl()}</b><span>home level</span></div></div>
    <h3 class="sec">Materials${qb('money')}</h3>
    <div class="mats">${Object.entries(MATS).map(([k,m])=>`<div>${matIcon(k)}${m.n}<b>${S.mats[k]||0}</b></div>`).join('')}</div>
    <p class="lead" style="margin-top:8px">Lumiks bring materials back from trips. Use them for treats and special decor.</p>
    <h3 class="sec">Permanent bonuses${qb('elders')}</h3>
    <div class="info"><div class="ln"><span>Elders at home (up to 3)</span><span>${el_} · +${Math.min(3,el_)*5}%</span></div><div class="ln"><span>Stars in the garden (up to 20)</span><span>${S.stars.length} · +${Math.min(20,S.stars.length)*2}%</span></div></div>
    ${S.stars.length?`<h3 class="sec">Star garden</h3><div class="garden">${S.stars.map(s=>`<span style="border-color:hsl(${s.hue} 60% 60%)">✦ ${esc(s.name)}</span>`).join('')}</div>`:''}
    <h3 class="sec">Settings</h3>
    <div class="toggle"><span>Sound effects</span><button class="btn sm ${S.sound!==false?'':'ghost'}" id="setSnd">${S.sound!==false?'On':'Off'}</button></div>
    <div class="toggle"><span>Music</span><button class="btn sm ${S.music?'':'ghost'}" id="setMus">${S.music?'On':'Off'}</button></div>
    <div class="toggle"><span>Tutorial<small>Show the tips from the start</small></span><button class="btn sm ghost" id="setTut">Replay</button></div>
    <h3 class="sec">Sparks economy</h3>
    <div class="burn"><div style="width:${Math.min(100,pct)}%"></div></div><div class="burnlbl">Spent ${pct}% of everything earned: ${S.spent} of ${S.earned} ✦</div>
    <h3 class="sec">Recent activity</h3>
    <div class="log">${S.log.slice(0,10).map(l=>`<div><span>${esc(l.why)}</span><b class="${l.n>0?'plus-n':'minus-n'}">${l.n>0?'+':''}${l.n} ${l.u||'✦'}</b></div>`).join('')}</div>
    ${S.dev?`<h3 class="sec">Testing</h3>
    <div class="toggle"><span>Speed up time ×60<small>An hour passes in a minute: trips, eggs, hunger, age</small></span><button class="btn sm ${GS()>1?'':'ghost'}" id="spd">${GS()>1?'On':'Off'}</button></div>
    <div class="toggle"><span>Next day<small>New tasks, streak, and +1 day of age for every lumik</small></span><button class="btn sm ghost" id="nextDay">Skip</button></div>`:''}
    <button class="reset" id="reset">Start over</button>`;
  $('#setSnd').addEventListener('click',()=>{S.sound=S.sound===false;sfx('tick');done()});
  $('#setMus').addEventListener('click',()=>{S.music=!S.music;S.music?startMusic():stopMusic();done()});
  $('#setTut').addEventListener('click',()=>{S.tut=0;S.seen={};S.welcome=false;setTab('home');done();showWelcome()});
  $('#spd')&&$('#spd').addEventListener('click',()=>{S.speed=GS()>1?1:60;toast(GS()>1?'Time sped up ×60 (new timers)':'Normal time');done()});
  $('#nextDay')&&$('#nextDay').addEventListener('click',()=>{S.dayOffset=(S.dayOffset||0)+1;S.pets.forEach(p=>{if(!p.egg)p.age=(p.age||0)+86400});ensureDay();toast('A new day has started');done()});
  const r=$('#reset');r.addEventListener('click',()=>{if(r.classList.contains('armed')){try{localStorage.removeItem(KEY)}catch(e){}S=initial();S.pets.forEach(p=>{if(!p.egg)discover(p)});ensureDay();breedSel=[];panel=null;toast('New game');setTab('home');done();return}
    r.classList.add('armed');r.textContent='All progress will be lost. Tap again';setTimeout(()=>{if(r.isConnected){r.classList.remove('armed');r.textContent='Start over'}},4000)});
}
function rename(){
  const p=sel(),b=$('#pname'),i=document.createElement('input');i.className='pname-input';i.id='pname-input';i.value=p.name;i.maxLength=14;
  b.replaceWith(i);i.focus();i.select();
  const fin=()=>{const v=i.value.trim();if(v)p.name=v;done()};
  i.addEventListener('blur',fin);i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur()});
}
function setTab(t){tab=t;if(t==='decor')tutEvent('decor');['home','tasks','decor','breed','atlas','eco'].forEach(k=>$('#tab-'+k).hidden=k!==t);
  document.querySelectorAll('.nav button').forEach(b=>b.dataset.tab===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  renderAll();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{haptic('s');if(game)return toast('Finish the game first');setTab(b.dataset.tab)}));
let devTaps=[];$('.brand').addEventListener('click',()=>{const t=Date.now();devTaps=devTaps.filter(x=>t-x<3000);devTaps.push(t);if(devTaps.length>=5){devTaps=[];S.dev=!S.dev;if(!S.dev)S.speed=1;toast(S.dev?'Test tools on (Stash tab)':'Test tools off');done()}});

/* ================= Telegram ================= */
const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
function haptic(k,v,snd){sfx(snd||(k==='n'?(v==='success'?'chime':v==='error'?'error':'tick'):k==='s'?'tick':v==='soft'?'purr':'pop'));try{if(!TG)return;if(k==='n')TG.HapticFeedback.notificationOccurred(v);else if(k==='s')TG.HapticFeedback.selectionChanged();else TG.HapticFeedback.impactOccurred(v)}catch(e){}}
function tgInit(){
  if(!TG)return;
  try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}
  const apply=()=>{document.documentElement.setAttribute('data-theme',TG.colorScheme==='dark'?'dark':'light');
    const bg=getComputedStyle(document.body).backgroundColor;try{TG.setHeaderColor(bg);TG.setBackgroundColor(bg);TG.setBottomBarColor&&TG.setBottomBarColor(bg)}catch(e){}};
  apply();TG.onEvent('themeChanged',apply);
  const u=TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u&&u.first_name)$('#sub').textContent=u.first_name+'’s home';
}
function start(data){
  tgInit();
  S=(data&&data.S)||load()||initial();
  migrate();S.pets.forEach(p=>{if(!p.egg)discover(p)});ensureDay();
  /* saves from the Russian version: rename built-in names */
  const RN={'Гостиная':'Living room','Спальня':'Bedroom','Детская':'Nursery','Мансарда':'Attic','Искорка':'Sparky','Мята':'Minty','Буся':'Boo'};
  S.rooms.forEach(r=>{if(RN[r.name])r.name=RN[r.name];else r.name=r.name.replace(/^Комната /,'Room ')});
  const TL='а:a,б:b,в:v,г:g,д:d,е:e,ё:yo,ж:zh,з:z,и:i,й:y,к:k,л:l,м:m,н:n,о:o,п:p,р:r,с:s,т:t,у:u,ф:f,х:kh,ц:ts,ч:ch,ш:sh,щ:sch,ъ:,ы:y,ь:,э:e,ю:yu,я:ya'.split(',').reduce((o,x)=>{const [k,v]=x.split(':');o[k]=v;return o},{});
  const en=n=>RN[n]||(/[а-яё]/i.test(n)?n.replace(/[а-яё]/gi,c=>{const t=TL[c.toLowerCase()]??c;return c===c.toLowerCase()?t:t.charAt(0).toUpperCase()+t.slice(1)}):n);
  S.pets.forEach(p=>{if(p.name)p.name=en(p.name);if(p.parents)p.parents=p.parents.map(en)});
  S.stars.forEach(s=>{s.name=en(s.name)});
  if(!S.lastTick)S.lastTick=Date.now();
  if(!S.dev)S.speed=1;
  if(S.tut===undefined)S.tut=TUT.length;S.seen=S.seen||{};
  setupHelp();if(!S.welcome)showWelcome();if(S.sound===undefined)S.sound=true;if(S.music===undefined)S.music=true;ensureGarden();
  $('#snd').addEventListener('click',()=>{const on=S.sound!==false||S.music;S.sound=!on;S.music=!on;on?stopMusic():(ac(),startMusic());if(!on)sfx('chime');done()});
  document.addEventListener('pointerdown',()=>{ac();startMusic()});
  document.addEventListener('visibilitychange',()=>document.hidden?stopMusic():startMusic());
  tick();setTab('home');setInterval(tick,1000);
  window.claude?.hot?.snapshot?.(()=>({S}));
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
